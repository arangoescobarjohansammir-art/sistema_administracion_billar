name: Publicar panel móvil

on:
  workflow_dispatch:
    inputs:
      supabase_url:
        description: URL pública de Supabase (opcional para la demo)
        type: string
      supabase_publishable_key:
        description: Clave sb_publishable_ (opcional para la demo)
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:admin
        env:
          VITE_SUPABASE_URL: ${{ inputs.supabase_url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase_publishable_key }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/admin

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
